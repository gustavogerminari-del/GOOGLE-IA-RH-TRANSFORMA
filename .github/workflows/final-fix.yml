name: Final One-line Repair

on:
  push:
    paths:
      - 'scripts/final-fix.mjs'
      - '.github/workflows/final-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/final-fix.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jobs/components/JobCandidatesManagementView.tsx
          git commit -m "fix: remove duplicate candidate status comparison"
          git push origin HEAD:main
