name: One-time Source Repair

on:
  push:
    paths:
      - 'scripts/repair-types.mjs'
      - '.github/workflows/repair-source.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/repair-types.mjs
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No repairs needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: normalize migrated Firebase application types"
          git push origin HEAD:main
